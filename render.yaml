databases:
  - name: kinetix-db
    databaseName: kinetix
    user: kinetix
    plan: free
    region: singapore

services:
  - type: web
    name: kinetix-api
    runtime: python
    rootDir: apps/api
    plan: free
    region: singapore
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: uv run alembic upgrade head
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: JWT_ALGORITHM
        value: HS256
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kinetix-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
