[project]
name = "kinetix-api"
version = "0.1.0"
description = "Kinetix Home Care API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "structlog>=24.1.0",
    "redis>=5.0.4",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.1.0",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "BLE001", "UP046", "TRY201", "F841", "DTZ003", "DTZ011", "UP047"]

[tool.mypy]
strict = true
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"
